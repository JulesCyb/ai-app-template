services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      APP_DB_PASSWORD: app
    volumes:
      - ./docker/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      DATABASE_URL_MIGRATIONS: postgresql+asyncpg://postgres:postgres@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Optional: model gateway. Start with `docker compose --profile gateway up -d`
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["gateway"]
    env_file: .env
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"

  # Langfuse (v3) needs ClickHouse, Redis, and MinIO: include the official docker-compose.yml from
  # https://github.com/langfuse/langfuse (docs/deployment.md) instead of rebuilding it here.

volumes:
  pgdata:
